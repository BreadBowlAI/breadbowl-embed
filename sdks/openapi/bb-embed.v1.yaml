        Deletes the index and every document, chunk and vector in it. Deletion is logical
        immediately: the index stops appearing in lists, its name can be reused, and its
        documents stop counting toward the tenant's document limit. Storage is reclaimed
        asynchronously. Deleting an index that does not exist returns 404. Required scope:
        `indexes:write`. Error codes: 404 `not_found`; 409 `idempotency_request_in_progress`;
