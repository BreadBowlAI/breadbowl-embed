openapi: 3.1.0
info:
  title: BreadBowl Embed API
  version: 1.3.0
  summary: Encoding, scoring and managed retrieval for the open BreadBowl Embed slot model.
  description: |
    The HTTP contract of the hosted `bb-embed` service. Self-hosted deployments serve the same
    contract. This document is the single source of truth for the public surface: server
    validation, SDK types and documentation are generated from it.

    The model is open source, so the API returns the model's own data, not only scores.
    There are three operation families:

    * **Encode** (`POST /v1/encode`) returns routing slots, value slots, slot→token attention
      and tokens for queries or documents. Nothing is stored.
    * **Score** (`POST /v1/score`) ranks up to 50 transient documents against one query. With
      `explain` and `return_attention` it returns everything needed to draw the full path
      query token → query slot → document slot → document token. Only a usage event is stored.
    * **Indexes** store encoded documents (identifiers, metadata, offsets and slot vectors,
      never text) and search them.

    ## Authentication and scopes

    Send `Authorization: Bearer <key>` on every `/v1/*` request. A key belongs to one tenant.
    A key may be limited to scopes; each operation names the scope it needs in its security
    requirement:

    | Scope | Operations |
    | --- | --- |
    | `encode` | `encode` |
    | `score` | `score` |
    | `indexes:read` | `listIndexes`, `getIndex`, `getDocument`, `searchIndex` |
    | `indexes:write` | `createIndex`, `deleteIndex`, `upsertDocuments`, `deleteDocument` |
    | none | `listModels`, `getModel`, `getUsage` |

    Keys created before scopes existed hold every scope. `GET /healthz` and `GET /readyz`
    need no key. Never put a key in a URL, a browser bundle or a log.

    ## Request IDs

    Every response, including errors and health probes, carries `x-request-id`. Quote it when
    reporting a problem.

    ## Errors

    Every non-2xx response except `GET /readyz` uses one envelope:

    ```json
    {"error": {"code": "validation_error", "message": "Request validation failed", "issues": []}}
    ```

    `code` is stable and machine-readable. `message` is for people and may change. `issues`
    appears only with `validation_error`; `details` carries structured data for some codes.
    A client that meets an unknown `code` must handle it by its HTTP status.

    | Status | Codes | Retry? |
    | --- | --- | --- |
    | 400 | `bad_request` (malformed JSON or headers) | No |
    | 401 | `authentication_failed`, `api_key_expired` | No |
    | 403 | `tenant_suspended`, `insufficient_scope` | No |
    | 404 | `not_found` | No |
    | 409 | `index_name_conflict`, `index_not_ready`, `model_revision_unavailable`, `representation_unavailable`, `idempotency_request_in_progress` | Only `index_not_ready` and `idempotency_request_in_progress`, after `Retry-After` |
    | 413 | `payload_too_large` | No |
    | 415 | `unsupported_media_type` | No |
    | 422 | `validation_error`, `invalid_cursor`, `unsupported_model`, `unsupported_search_profile`, `unsupported_filter`, `attention_limit_exceeded`, `document_limit_exceeded`, `chunk_limit_exceeded`, `idempotency_key_reused` | No |
    | 429 | `rate_limit_exceeded`, `concurrency_limit_exceeded` | Yes, after `Retry-After` (seconds) |
    | 429 | `usage_limit_exceeded` | No: the monthly allowance is exhausted; `Retry-After` points to the start of the next UTC month (can be weeks). Raise the limit or wait. |
    | 500 | `internal_error` | Yes, bounded exponential backoff |
    | 503 | `service_unavailable` | Yes, honor `Retry-After` when present |

    Request bodies are validated strictly: unknown fields, and options a model or index does not
    support, fail with 422 instead of being ignored. Unknown query parameters are ignored.

    Each operation lists the codes it can return per status in `x-error-codes`. Codes whose
    `details` have a defined shape are typed by the `Error` schema (for example
    `insufficient_scope` → `InsufficientScopeDetails`).

    ## Retries and idempotency

    Retry 429 (except `usage_limit_exceeded`), 500, 502, 503, 504, timeouts and connection
    failures with bounded exponential backoff, honoring `Retry-After`. Do not retry other 4xx
    responses.

    Only requests that complete with a 2xx response are billed. Usage (`input_tokens` and the
    counters of `GET /v1/usage`) is recorded only for 2xx responses; a failed or rejected
    attempt (any 4xx or 5xx) consumes no monthly allowance, so retrying a failed `encode`,
    `score` or `searchIndex` is never billed twice. A request that succeeded on the server is
    billed even if the client never received the response (for example after a client-side
    timeout), and a retry of it is billed again. `upsertDocuments` bills only the documents it
    reports as `upserted`.

    Mutations (`createIndex`, `deleteIndex`, `upsertDocuments`, `deleteDocument`) accept an
    optional `Idempotency-Key` header. The key is scoped to the tenant and the operation
    (method plus path) and kept for 24 hours after the first request completes. A retry with the
    same key and the same body (compared after RFC 8785 JSON canonicalization) replays the stored
    status and body with `Idempotent-Replayed: true` and is not billed again. The same key with a
    different body fails with 422 `idempotency_key_reused`; a retry while the first request is
    still running fails with 409 `idempotency_request_in_progress`. Only 2xx responses are
    stored; any other outcome releases the key. Upserts and deletes are also naturally
    idempotent by `doc_id`; the header additionally prevents double billing of a retried upsert.

    `encode`, `score` and `searchIndex` store nothing and do not take `Idempotency-Key`; every
    attempt that succeeds is billed, so a retried `encode`, `score` or `searchIndex` that
    succeeds again is billed again.

    ## Pagination

    List operations take `limit` (1–100, default 20) and an opaque `cursor`, and return
    `{"data": [...], "has_more": bool, "next_cursor": string|null}`. `next_cursor` is a string
    exactly when `has_more` is `true` and `null` exactly when it is `false`. Pass `next_cursor`
    back unchanged to get the next page. A cursor is bound to the list and its filters; a cursor
    from another list or with different filters fails with 422 `invalid_cursor`.

    ## Numbers

    Counters that accumulate over time without a bound (token totals, request totals) are
    decimal strings such as `"50000000"`, so no client loses integer precision. Per-request
    quantities and counts of stored resources are JSON integers. Scores are JSON numbers
    computed in float32 and serialized as the shortest decimal that round-trips.

    ## Tensors

    Tensors are objects with `dtype`, `shape`, `axes`, `encoding` and `data`, in row-major
    (C) order. `encoding_format: base64` (the default) returns `data` as base64 of the
    little-endian `dtype` bytes; its length is `product(shape) × itemsize`. `encoding_format:
    float` returns `data` as nested JSON arrays matching `shape`, each value written as the
    shortest decimal that round-trips to the same `dtype` value; it is convenient for small
    tensors and roughly four times larger than base64 for big ones. `dtype` defaults to
    `float16`, the dtype an index stores; `float32` is available for full precision.

    The request's `dtype` applies to routing slots, value slots and attention. The four
    explanation tensors (`Explanation`) are always `float32`, whatever `dtype` says, so that
    `routing_score = mean(routing_contribution)` and the rows of `value_attention` summing to 1
    hold to float32 precision; `encoding_format` applies to them as to every tensor.

    Routing slots are L2-normalized. Value slots are raw (not normalized); scoring normalizes
    the query value slots and the value readout, never the stored document value slots.

    Examples marked `x-abbreviated: true` shorten tensor `data` (and token lists) for
    readability: their `data` does not have `product(shape) × itemsize` bytes, so strict
    decoders must skip them. Every other example is self-consistent.

    ## Tokens and character offsets

    Token `start`/`end` and chunk `char_start`/`char_end` are offsets into the caller's
    original string, counted in **Unicode code points** (not UTF-16 code units, not bytes),
    end-exclusive. JavaScript clients must convert before slicing a JS string (the TypeScript
    SDK provides a helper). The v1.3 tokenizer adds no special tokens, so v1.3 responses have
    only `template` and `input` tokens. Tokens that come from the instruction template or are special
    tokens have `start` and `end` set to `null`. A byte-level token that covers only part of a
    character reports the whole character, so neighbouring tokens can share a span; its `text`
    is empty until the token that completes the character, which carries the whole character
    (see `Token.text`).

    ## Ordering and ties

    `score` results sort by `score` descending, then by position in the request ascending.
    `searchIndex` results sort by `score` descending, then by `doc_id` ascending (UTF-8 byte
    order), then by `chunk_index` ascending. Ordering uses the exact float32 scores before
    serialization.

    ## Limits

    | Limit | Value |
    | --- | --- |
    | Request body | 5 MiB |
    | Inputs per `encode` | 50 |
    | Documents per `score` or `upsertDocuments` | 50 |
    | Query text | 8 KiB UTF-8 |
    | Document text | 100 KiB UTF-8 |
    | Instruction text | 1 KiB UTF-8 |
    | `doc_id` | 1–255 characters |
    | Metadata | 64 keys, 8 KiB UTF-8 serialized, scalar values only |
    | `top_k` / `candidate_k` | ≤ 100 / ≤ 500 |
    | Attention values per request | 1,048,576 |
    | Chunks per `upsertDocuments` | 128 (after chunking; 422 `chunk_limit_exceeded`) |
    | Query / document tokens | 128 / 384 (longer text is truncated at the end and flagged) |

    Encoding is compute-bound. On the hosted CPU deployment one 384-token chunk takes about
    0.3–0.45 s and chunks are encoded one at a time, so `upsertDocuments` runs at roughly 2.4–3.5
    chunks per second: a request at the chunk limit takes 40–60 s, longer while other upserts
    are queued. Use client timeouts of at least 120 s for upserts and send interactive batches of
    a few documents. Searches, scores of a few documents and query encodes are not queued behind
    upserts (they use separate capacity) and take well under a second.

    `GET /v1/models/{model}` reports these limits for a deployment; clients should read them
    rather than hard-coding them. Per-tenant limits (requests per minute, concurrent requests,
    monthly input tokens, stored documents) are reported by `GET /v1/usage`.

    ## Data handling

    `text_retention` is always `none`. Text is processed transiently. Indexes persist document
    identifiers, metadata, content hashes, token and character offsets, and slot vectors.
    `encode` and `score` persist only a usage event. Do not submit regulated data.
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: https://embed.breadbowl.ai
    description: The hosted BreadBowl Embed service.
  - url: '{scheme}://{host}'
    description: A self-hosted deployment; it listens on port 8080 by default.
    variables:
      scheme:
        default: http
        enum: [http, https]
      host:
        default: localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Unauthenticated liveness and readiness probes.
  - name: Models
    description: Immutable model identities, dimensions, defaults, capabilities and limits.
  - name: Encode
    description: Raw model output for queries and documents. Nothing is stored.
  - name: Score
    description: Rank and explain transient documents against one query. Nothing is stored.
  - name: Indexes
    description: Managed indexes that pin a model revision and a search profile.
  - name: Documents
    description: Batch upsert, inspection and deletion of documents in an index.
  - name: Search
    description: Query an index with optional explanations and stored vectors.
  - name: Usage
    description: Current-month usage, limits and remaining allowance of the calling tenant.

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 while the API process runs. It does not check any dependency.
      security: []
      responses:
        '200':
          description: The API process is alive.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                ok: true

  /readyz:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Readiness probe
      description: >-
        Returns 200 only when the database, the vector store and the model worker are ready and
        the worker serves the expected default model revision. Otherwise returns 503 with
        `{"ok": false}`; the body deliberately does not say which dependency failed.
      security: []
      responses:
        '200':
          description: Ready to serve traffic.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
              example:
                ok: true
                model:
                  id: breadbowl-embed-v1.3
                  revision: 6f1d2c9a4b7e8f0123456789abcdef0123456789
        '503':
          description: Not ready.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotReadyStatus'
              example:
                ok: false

  /v1/models:
    get:
      operationId: listModels
      x-error-codes:
        '401': [authentication_failed, api_key_expired]
        '403': [tenant_suspended]
        '422': [validation_error, invalid_cursor]
        '429': [rate_limit_exceeded, concurrency_limit_exceeded]
        '500': [internal_error]
        '503': [service_unavailable]
      tags: [Models]
      summary: List models
      description: >-
        Lists the models this deployment serves, default model first, then by `id` ascending.
        Any valid key may call it.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of models.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
              examples:
                default:
                  $ref: '#/components/examples/ModelListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/models/{model}:
    get:
      operationId: getModel
      x-error-codes:
        '401': [authentication_failed, api_key_expired]
        '403': [tenant_suspended]
        '404': [not_found]
        '429': [rate_limit_exceeded, concurrency_limit_exceeded]
        '500': [internal_error]
        '503': [service_unavailable]
      tags: [Models]
      summary: Get a model
      description: >-
        Returns one model by immutable id or by alias. An alias resolves to the model it
        currently names; the response always carries the immutable `id` and `revision`.
        Error codes: 404 `not_found`.
      parameters:
        - $ref: '#/components/parameters/ModelName'
      responses:
        '200':
          description: The model.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
              examples:
                default:
                  $ref: '#/components/examples/ModelExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/encode:
    post:
      operationId: encode
      x-error-codes:
        '400': [bad_request]
        '401': [authentication_failed, api_key_expired]
        '403': [tenant_suspended, insufficient_scope]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [validation_error, unsupported_model, attention_limit_exceeded]
        '429': [rate_limit_exceeded, concurrency_limit_exceeded, usage_limit_exceeded]
        '500': [internal_error]
        '503': [service_unavailable]
      tags: [Encode]
      summary: Encode queries or documents
      description: |
        Encodes 1–50 texts of one `input_type` and returns, per text, the parts selected by
        `return`: routing slots `[slots, routing_dim]`, value slots `[slots, value_dim]`,
        slot→token attention `[heads, slots, tokens]` and the tokens with character offsets.

        Queries are formatted with the model's `query_format` and `instruction` (default
        `Retrieve relevant documents.`) and truncated to 128 tokens; documents use
        `document_format` and are truncated to 384 tokens. Truncation removes tokens from the
        end of the caller's text and sets `truncated: true`. `token_count` counts every encoded
        token, including template and special tokens, and is what `usage.input_tokens` bills.

        Attention is large (heads × slots × tokens values per text). The total number of
        attention values returned by one request may not exceed
        `limits.max_attention_values_per_request` (1,048,576). The server tokenizes first and
        rejects an over-limit request with 422 `attention_limit_exceeded` before running the
        model; rejected requests are not billed. `attention_heads: mean` cuts the size by the
        number of heads.

        Required scope: `encode`. Error codes: 422 `validation_error`, `unsupported_model`,
        `attention_limit_exceeded`; 429 `rate_limit_exceeded`, `concurrency_limit_exceeded`,
        `usage_limit_exceeded`.
      security:
        - bearerAuth: [encode]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncodeRequest'
            examples:
              queryWithAttention:
                summary: One query with routing, attention and tokens
                value:
                  input: rotate key
                  input_type: query
                  return: [routing, attention, tokens]
                  attention_heads: mean
              documents:
                summary: Two documents, routing and value slots as float32
                value:
                  model: breadbowl-embed-v1.3
                  input:
                    - Keys can be rotated from the dashboard.
                    - Refunds are available within 30 days.
                  input_type: document
                  return: [routing, value]
                  dtype: float32
      responses:
        '200':
          description: One entry per input, in input order.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncodeResponse'
              examples:
                queryWithAttention:
                  $ref: '#/components/examples/EncodeResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/score:
    post:
      operationId: score
      x-error-codes:
        '400': [bad_request]
        '401': [authentication_failed, api_key_expired]
        '403': [tenant_suspended, insufficient_scope]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [validation_error, unsupported_model, attention_limit_exceeded]
        '429': [rate_limit_exceeded, concurrency_limit_exceeded, usage_limit_exceeded]
        '500': [internal_error]
        '503': [service_unavailable]
      tags: [Score]
      summary: Score transient documents against a query
      description: |
        Encodes one query and 1–50 documents and returns all documents ranked by
        `score = routing_weight × routing_score + value_weight × value_score`
        (defaults 0.75 and 0.25; the values used are echoed in `scoring`). Every result carries
        `score`, `routing_score` and `value_score`. Documents longer than 384 tokens are
        truncated, not chunked; use an index for long documents.

        * `explain: true` adds, per document, the four tensors the score is computed from:
          `slot_similarity`, `routing_contribution`, `value_attention` and `value_slot_cosine`
          (see `Explanation`). `routing_score` equals the mean of `routing_contribution` and
          `value_score` the mean of `value_slot_cosine`, up to float32 rounding.
        * `return_attention: true` adds the query's and each document's slot→token attention
          and tokens. Together with `explain` this is the full map query token → query slot →
          document slot → document token. The attention cap of `encode` applies to the sum of
          the query's and all documents' attention values.

        Results sort by `score` descending, ties by request position. Nothing but a usage event
        is stored.

        Required scope: `score`. Error codes: 422 `validation_error`, `unsupported_model`,
        `attention_limit_exceeded`; 429 `rate_limit_exceeded`, `concurrency_limit_exceeded`,
        `usage_limit_exceeded`.
      security:
        - bearerAuth: [score]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreRequest'
            examples:
              basic:
                summary: Rank two documents
                value:
                  query: refund policy
                  documents:
                    - doc_id: a
                      text: Refunds are available within 30 days.
                      metadata:
                        source: help-center
                    - doc_id: b
                      text: Keys can be rotated from the dashboard.
              explained:
                summary: Rank with explanations and attention maps
                value:
                  query: refund policy
                  documents:
                    - doc_id: a
                      text: Refunds accepted.
                  explain: true
                  return_attention: true
                  attention_heads: mean
      responses:
        '200':
          description: All documents, ranked.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreResponse'
              examples:
                basic:
                  $ref: '#/components/examples/ScoreResponseExample'
                explained:
                  $ref: '#/components/examples/ScoreResponseExplainedExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/indexes:
    post:
      operationId: createIndex
      x-error-codes:
        '400': [bad_request]
        '401': [authentication_failed, api_key_expired]
        '403': [tenant_suspended, insufficient_scope]
        '409': [index_name_conflict, idempotency_request_in_progress]
        '413': [payload_too_large]
        '415': [unsupported_media_type]
        '422': [validation_error, unsupported_model, unsupported_search_profile, idempotency_key_reused]
        '429': [rate_limit_exceeded, concurrency_limit_exceeded]
        '500': [internal_error]
        '503': [service_unavailable]
      tags: [Indexes]
      summary: Create an index
      description: |
        Creates an index that pins, for its whole life, the resolved model revision, its
        representation (dimensions, normalization, stored dtype, slot schema version) and a
        named search profile with its parameters. Upgrading the model means creating a new
        index and re-ingesting; the service never mixes representations in one index. Index
        names are unique within a tenant.

        Required scope: `indexes:write`. Error codes: 409 `index_name_conflict`,
        `idempotency_request_in_progress`; 422 `validation_error`, `unsupported_model` (unknown
        or deprecated model), `unsupported_search_profile`, `idempotency_key_reused`.
      security:
        - bearerAuth: ['indexes:write']
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIndexRequest'
            examples:
              minimal:
                summary: Defaults for model, profile and chunking
                value:
                  name: production
              explicit:
                summary: Explicit model, profile, chunking and metadata schema
                value:
                  name: support-articles
                  model: breadbowl-embed-v1.3
                  search_profile: paper
                  text_retention: none
                  chunking:
                    strategy: token_window
                    max_tokens: 256
                    overlap_tokens: 32
                    minimum_chunk_tokens: 16
                  metadata_schema:
                    source: string
                    year: number
      responses:
        '201':
          description: The index was created.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              description: URL of the new index.
              schema:
                type: string
                format: uri-reference
                examples: [/v1/indexes/0b8a3d0e-5c1f-4f7e-9a51-3e2d6c4b1a90]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Index'
              examples:
                default:
                  $ref: '#/components/examples/IndexExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
